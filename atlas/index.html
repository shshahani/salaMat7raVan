<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اطلس جامع تهران</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; margin: 0; }
        .container { text-align: center; padding: 20px; max-width: 400px; }
        .btn { display: inline-block; padding: 15px 30px; background-color: #1a73e8; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hint { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>اطلس جامع تهران</h1>
        <p>برای مشاهده صحیح نقشه در اپلیکیشن گوگل‌مپ:</p>
        
        <!-- اصلاح شده برای تلاش در خروج از WebView -->
        <a href="https://www.google.com/maps/d/edit?mid=1i-9rDiRgkBLmOdE2NIwstIgkhBTpYN8&ll=35.71016903629814%2C51.347655209542154&z=11" 
           target="_blank" 
           rel="noopener noreferrer" 
           class="btn">
           باز کردن در Google Maps
        </a>

        <p class="hint">اگر نقشه باز نشد، روی سه نقطه بالا گوشه صفحه بزنید و <b>Open in Browser</b> را انتخاب کنید.</p>
    </div>
</body>
</html>
